name: Build APK dan Simpan ke Branch Release
on: [push, workflow_dispatch]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Membatasi penggunaan memori Gradle di server agar tidak menyentuh batas RAM GitHub
  GRADLE_OPTS: "-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kode dari Repositori
        uses: actions/checkout@v4

      - name: Ekstrak File ZIP Proyek
        run: |
          unzip *.zip -d proyek_kamu
          cd proyek_kamu

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ambil Dependensi
        run: |
          cd proyek_kamu
          flutter pub get

      - name: Merakit APK split (Sangat Ringan untuk RAM)
        run: |
          cd proyek_kamu
          # Menggunakan --split-per-abi membuat server merakit komponen secara terpisah (jauh lebih ringan)
          flutter build apk --debug --no-pub --split-per-abi

      - name: Siapkan Folder Pengiriman APK
        run: |
          mkdir -p output-apk
          # Mengambil file hasil split untuk arsitektur HP modern (arm64)
          cp proyek_kamu/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk output-apk/Aplikasi-AI-Samsung-A50.apk

      - name: Push APK ke Branch apk-release
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output-apk
          publish_branch: apk-release
          force_orphan: true
